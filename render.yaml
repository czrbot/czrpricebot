# Preview workers stay disabled to avoid duplicate bot instances.
previews:
  generation: off
services:
  - type: worker
    name: czr-price-bot
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      # Keep operator-approved activation across Blueprint syncs.
      # New installations must enter false until approved.
      - key: CZR_LIVE_POSTING
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: bot-state
      mountPath: /state
      sizeGB: 1
